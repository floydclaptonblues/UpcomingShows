name: One-time Upcoming Shows hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bmc-shorty-mural-hotfix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update August 2 and default artist artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          mural = 'https://floydclaptonblues.github.io/Balcony-Music-Club-PWA/assets/venue/20260213_212259%20(1).jpg?v=20260730-band-fallback'

          shows_path = Path('shows.json')
          shows = shows_path.read_text(encoding='utf-8')
          old_show = '{"time":"9:00 PM – 11:30 PM","artist":"TBA","photo":"","alt":"","headliner":true}'
          new_show = '{"time":"9:00 PM – 11:30 PM","artist":"SHORTY AND THE GIANTS","photo":"' + mural + '","alt":"Balcony Music Club mural fallback for Shorty and The Giants","headliner":true}'
          august_two = re.compile(r'(\{"date":"Sunday • August 2","shows":\[.*?)(\{"time":"9:00 PM – 11:30 PM","artist":"TBA","photo":"","alt":"","headliner":true\})(.*?\]\})')
          if old_show in shows:
              shows, count = august_two.subn(lambda m: m.group(1) + new_show + m.group(3), shows, count=1)
              if count != 1:
                  raise SystemExit('August 2 TBA slot was not uniquely found')
          elif '"artist":"SHORTY AND THE GIANTS"' not in shows:
              raise SystemExit('August 2 schedule entry was not found')
          shows = re.sub(r'"last_updated": "[^"]+"', '"last_updated": "2026-07-30"', shows, count=1)
          shows = shows.replace(
              'Blank Sunday 9:00 PM August slots are retained as TBA placeholders.',
              'The August 2 9:00 PM slot is filled by Shorty and The Giants; remaining blank Sunday 9:00 PM August slots are retained as TBA placeholders.'
          )
          shows_path.write_text(shows, encoding='utf-8')

          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')
          anchor = 'const JOHN_LISI_DELTA_FUNK_PHOTO = "https://images.squarespace-cdn.com/content/v1/5872a05fb8a79b5c39e888e8/1570220588454-ROAJNS29CYDX7TFZ3B09/johnlisi.jpg?format=1000w";'
          mural_line = 'const BMC_MURAL_FALLBACK = "' + mural + '";'
          if 'const BMC_MURAL_FALLBACK' not in script:
              if anchor not in script:
                  raise SystemExit('Photo-constant anchor was not found')
              script = script.replace(anchor, anchor + '\n' + mural_line, 1)

          old_tail = """  if (existingPhoto && !candidates.includes(existingPhoto)) {
    candidates.push(existingPhoto);
  }

  return candidates;
}"""
          new_tail = """  if (existingPhoto && !candidates.includes(existingPhoto)) {
    candidates.push(existingPhoto);
  }

  if (!candidates.includes(BMC_MURAL_FALLBACK)) {
    candidates.push(BMC_MURAL_FALLBACK);
  }

  return candidates;
}"""
          if old_tail in script:
              script = script.replace(old_tail, new_tail, 1)
          elif new_tail not in script:
              raise SystemExit('photoCandidates tail was not found')
          script_path.write_text(script, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(
              r'\.\/script\.js\?v=[^"\']+',
              './script.js?v=20260730-shorty-mural-fallback',
              index,
              count=1
          )
          index_path.write_text(index, encoding='utf-8')

          workflow = Path('.github/workflows/bmc-shorty-mural-hotfix.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit final update
        shell: bash
        run: |
          git config user.name "BMC Schedule Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update Aug 2 act and use BMC mural fallback"
          git push
